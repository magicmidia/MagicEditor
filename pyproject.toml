[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magiceditor"
version = "0.9.2"
description = "High-performance text/code editor with virtual viewport, piece table, and mmap for huge files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MagicEditor Contributors" }]
keywords = ["editor", "pyqt6", "text", "code"]
dependencies = [
  "PyQt6>=6.6",
  "markdown>=3.5",
  "QtAwesome>=1.3",
  "pyspellchecker>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyinstaller>=6.0",
]
[project.scripts]
magiceditor = "magiceditor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magiceditor"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/magiceditor", "locales", "resources", "README.md", "AGENTS.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [".worktrees", "tmp", ".venv", "venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
  "PL",  # pylint subset
  "RUF", # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments — Qt constructors often need many params
  "PLR0911", # too many returns — fine for small pure helpers
  "PLR0915", # too many statements — UI constructors wire many widgets
  "PLR2004", # magic values — OK in parsers (0x0A etc.)
  "SIM105",  # contextlib.suppress optional style
  "SIM108",  # ternary style optional
  "N802",    # Qt overrides use camelCase (highlightBlock, etc.)
  "PLR0912", # complex key handlers / paint paths in UI widgets
  "PLC0415", # lazy imports intentional (optional Qt, cold start, optional packs)
  "PLW0603", # deliberate module-level icon pack singleton
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "E402"]
"**/__main__.py" = ["E402"]
"**/app.py" = [] # PLC0415 covered globally

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--strict-markers", "--tb=short"]
markers = [
  "ui: Qt UI tests (requires display / offscreen)",
  "slow: long-running tests",
  "huge_file: tests involving large file fixtures",
  "perf: optional performance harness (K17)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["magiceditor"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["magiceditor"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

# N4 — per-package floors (core high; ui smoke + extracts)
[tool.magiceditor.coverage]
fail_under_core = 80
fail_under_ui = 35
fail_under_services = 55
